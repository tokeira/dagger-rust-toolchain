[package]
name = "rust-lane-helper"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Runs a compile lane's Cargo command in one step: mirrors the source by content, runs the command, and keeps what later steps read."

# A workspace of its own, so that Cargo looks for none above it.
[workspace]

[profile.release]
strip = true
